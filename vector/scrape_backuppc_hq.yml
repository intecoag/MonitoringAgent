api:
  enabled: true
  address: 0.0.0.0:8686
sources:
  vector_logs:
    type: internal_logs
  docker:
    type: docker_logs
  # host_metrics:
  #   type: host_metrics
  #   scrape_interval_secs: 60
  #   namespace: 'node'
  vector_metrics:
    type: internal_metrics
    scrape_interval_secs: 60
  prometheus_scrape:
    type: prometheus_scrape
    endpoints:
      - http://docker-exporter:9487/metrics
    scrape_interval_secs: 60
    instance_tag: job
transforms:
  msg_parser:
    type: remap
    inputs: [docker, vector_logs]
    source: |
      .message = parse_json(.message) ?? .message

      .level = get(., ["level"]) ?? null
      if is_null(.level) || .level == "" {
        .level = get(., ["severity_text"]) ?? null
      }
      if is_null(.level) || .level == "" {
        .level = get(., ["severity"]) ?? null
      }
      if is_null(.level) || .level == "" {
        .level = get(., ["log_level"]) ?? null
      }
      if is_null(.level) || .level == "" {
        .level = get(., ["message", "level"]) ?? null
      }
      if is_null(.level) || .level == "" {
        .level = get(., ["message", "severity_text"]) ?? null
      }
      if is_null(.level) || .level == "" {
        .level = get(., ["message", "severity"]) ?? null
      }
      if is_null(.level) || .level == "" {
        .level = get(., ["message", "log_level"]) ?? null
      }
      if is_null(.level) || .level == "" {
        .level = get(., ["message", "log", "level"]) ?? null
      }
      if is_null(.level) || .level == "" {
        .level = "unknown"
      }
      .level = downcase(to_string!(.level))

      .instance = "backuppc-hq"
  add_labels_metrics:
    type: remap
    inputs: [vector_metrics, prometheus_scrape]
    source: |
      .tags.instance = "backuppc-hq"
sinks:
  elasticsearch:
    type: elasticsearch
    inputs: [msg_parser]
    endpoints: [https://logs.monitoring.inteco.ch/insert/elasticsearch/]
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    request:
      headers:
        VL-Stream-Fields: source_type,label.com.docker.compose.service,level,instance
        VL-Time-Field: timestamp
        VL-Msg-Field: message,msg,_msg,message.message,message.log
        AccountID: "0"
        ProjectID: "0"
  victoriametrics:
    type: prometheus_remote_write
    endpoint: https://metrics.monitoring.inteco.ch/api/v1/write
    inputs: [add_labels_metrics]
    healthcheck:
      enabled: false
  debug_console:
    type: console
    inputs: [msg_parser]
    target: stdout
    encoding:
      codec: json